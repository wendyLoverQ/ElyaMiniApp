<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>玻璃生态瓶</title>
    <link rel="preload" href="terrarium-base-v2.png" as="image">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main id="terrarium" class="terrarium" aria-label="玻璃生态瓶">
      <canvas
        id="scene"
        width="420"
        height="500"
      ></canvas>
      <button
        id="water-control"
        class="water-control"
        type="button"
        data-elya-hit="interactive"
        aria-label="给生态瓶浇水"
        title="给生态瓶浇水"
      ></button>
      <span id="storage-status" class="storage-status" aria-hidden="true">!</span>
    </main>
    <script type="module" src="main.js"></script>
  </body>
</html>
